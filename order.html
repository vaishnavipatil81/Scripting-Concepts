<!DOCTYPE html>
<html>
<head>
    <title>Sort 3 Numbers Descending</title>
</head>
<body>

<h2>Sort Three Numbers in Descending Order</h2>

<script>
   
    let a = Number(prompt("Enter first number:"));
    let b = Number(prompt("Enter second number:"));
    let c = Number(prompt("Enter third number:"));

    function sortDescending(a, b, c) {

        
        if (a < b) {
            a = a + b;
            b = a - b;
            a = a - b;
        }

        if (a < c) {
            a = a + c;
            c = a - c;
            a = a - c;
        }

        if (b < c) {
            b = b + c;
            c = b - c;
            b = b - c;
        }

        document.write("<h3>Descending Order: " + a + ", " + b + ", " + c + "</h3>");
    }

   
    sortDescending(a, b, c);
</script>

</body>
</html>
